# Test 1 on BlueBear (A100 40 GB): one hidden fact per agent, cyclic option rotations.
# The model names below are examples; replace them with the small models chosen for Test 1.
# Run once per model with --model, e.g. --model meta-llama/Llama-3.2-3B-Instruct.
experiment:
  name: hb_test1_single_fact
  dataset: hiddenbench
  protocol: single_round

models:
  test1_model:
    hf_name: Qwen/Qwen3.5-0.8B
    model_class: auto
    dtype: bfloat16
    device: cuda

agents:
  facts_per_agent: 1
  default_model: test1_model
  overrides: {}

prompts:
  dir: prompts/hiddenbench_qwen35_08b
  template: answer_only
  option_rotation: cyclic

generation:
  max_new_tokens: 4
  max_new_tokens_reasoning: 256
  do_sample: false
  seed: 0

telemetry:
  enabled: true
  capture_content: false        # keeps traces small for large runs
  otlp_endpoint: null
