# No-key ablation (E6): the clinical key is removed; everything else as in prompts/wearableqa_phenotype.
# Glycaemic clinic agent: part of the METABOLIC judgement (glucose, HbA1c, insulin, HOMA-IR).
# Each blood placeholder renders as "<value> <unit>" or shared.not_measured; {homa} is computed as glu x ins / 405.
name: clinic_glycaemic
version: 1-nokey
device: glycaemic clinic
axis: metabolic
units: {glu: mg/dL, hba1c: "%", ins: uIU/mL, homa: ""}
data: |
  === YOUR DATA (glycaemic clinic, latest blood test) ===
  Age: {age}. Sex: {sex}.
  Fasting glucose: {glu}
  HbA1c: {hba1c}
  Fasting insulin: {ins}
  HOMA-IR (glucose x insulin / 405): {homa}
key: ""
steps: |
  1. Decide the metabolic judgement from your tests.
  2. Other blood tests, which you do not see, can also show an adverse profile. If your tests are normal, favour FAVOURABLE but do not rule out ADVERSE.
  3. Your data says nothing about the fitness judgement. Treat both answers to it as equally likely: do not guess it.
  4. If a value is "not measured", do not treat it as normal.
